<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="100%" height="100%" role="img" aria-label="Cloud Architecture Code Terminal">
  <title>Pavan Datta Gedila - Cloud Architecture Code Terminal</title>
  <defs>
    <!-- Window Base Background -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090c"/>
      <stop offset="50%" stop-color="#050507"/>
      <stop offset="100%" stop-color="#080709"/>
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="termHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="50%" stop-color="#111115"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>

    <!-- Syntax Colors -->
    <!-- Keywords: #E8203A, Strings: #F8E028, Types: #64B5F6, Constants: #81C784, Comments: #888, Vars: #F8F0E0 -->
  </defs>

  <!-- Outer Window Container with Cyber Border -->
  <rect x="2" y="2" width="896" height="326" rx="8" fill="url(#termBg)" stroke="#B8893F" stroke-width="1.2" opacity="0.95"/>
  <rect x="4" y="4" width="892" height="322" rx="7" fill="none" stroke="#E8203A" stroke-width="0.6" opacity="0.4"/>

  <!-- Terminal Title Bar -->
  <path d="M4 10 C4 6 7 4 11 4 H889 C893 4 896 6 896 10 V36 H4 Z" fill="url(#termHeader)"/>
  <line x1="4" y1="36" x2="896" y2="36" stroke="#B8893F" stroke-width="0.8" opacity="0.45"/>

  <!-- Window Control Buttons (Red, Gold, Green) -->
  <circle cx="24" cy="20" r="5.5" fill="#E8203A"/>
  <circle cx="42" cy="20" r="5.5" fill="#F8E028"/>
  <circle cx="60" cy="20" r="5.5" fill="#25D366"/>

  <!-- Active Tab -->
  <path d="M85 10 H250 V36 H85 Z" fill="#050507" stroke="#B8893F" stroke-width="0.6" opacity="0.8"/>
  <text x="100" y="24" fill="#64B5F6" font-family="'Courier New', monospace" font-size="11" font-weight="700">TS</text>
  <text x="122" y="24" fill="#F8F0E0" font-family="'Courier New', monospace" font-size="11">cloud-architecture.ts</text>
  <circle cx="236" cy="20" r="2.5" fill="#E8203A"/>

  <!-- Terminal Info on Right -->
  <text x="870" y="24" text-anchor="end" fill="#888" font-family="'Courier New', monospace" font-size="10.5">pavangitu@aws-core: ~/deploy</text>

  <!-- Code Body Area -->
  <g font-family="'Courier New', 'Fira Code', 'Cascadia Code', monospace" font-size="12" letter-spacing="0.3">
    <!-- Line Numbers -->
    <g fill="#555" text-anchor="end">
      <text x="36" y="65">01</text>
      <text x="36" y="85">02</text>
      <text x="36" y="105">03</text>
      <text x="36" y="125">04</text>
      <text x="36" y="145">05</text>
      <text x="36" y="165">06</text>
      <text x="36" y="185">07</text>
      <text x="36" y="205">08</text>
      <text x="36" y="225">09</text>
      <text x="36" y="245">10</text>
      <text x="36" y="265">11</text>
      <text x="36" y="285">12</text>
      <text x="36" y="305">13</text>
    </g>

    <!-- Dividing Vertical Rule -->
    <line x1="48" y1="46" x2="48" y2="315" stroke="#333" stroke-width="0.8"/>

    <!-- Code Line 1 -->
    <g transform="translate(60, 65)">
      <text fill="#E8203A">import</text>
      <text x="50" fill="#F8F0E0">{ CloudCluster, Microservice, AIModel }</text>
      <text x="350" fill="#E8203A">from</text>
      <text x="385" fill="#F8E028">'@pavangitu/cloud-core'</text>
      <text x="560" fill="#F8F0E0">;</text>
    </g>

    <!-- Code Line 2 -->
    <g transform="translate(60, 85)">
      <text fill="#888">// Initializing Pavan Datta Gedila's High-Availability Cloud Infrastructure</text>
    </g>

    <!-- Code Line 3 -->
    <g transform="translate(60, 105)">
      <text fill="#E8203A">export const</text>
      <text x="95" fill="#64B5F6">PavanArchitecture</text>
      <text x="235" fill="#F8F0E0">: <tspan fill="#64B5F6">CloudCluster</tspan> = {</text>
    </g>

    <!-- Code Line 4 -->
    <g transform="translate(78, 125)">
      <text fill="#F8F0E0">leadArchitect:</text>
      <text x="125" fill="#F8E028">"Pavan Datta Gedila"</text>
      <text x="285" fill="#888">, // B.Tech CSE (Centurion Univ | CGPA: 8.3)</text>
    </g>

    <!-- Code Line 5 -->
    <g transform="translate(78, 145)">
      <text fill="#F8F0E0">cloudPlatform:</text>
      <text x="125" fill="#F8F0E0">[</text>
      <text x="135" fill="#F8E028">"AWS EC2"</text>
      <text x="205" fill="#F8F0E0">, </text>
      <text x="220" fill="#F8E028">"AWS RDS MySQL"</text>
      <text x="345" fill="#F8F0E0">, </text>
      <text x="360" fill="#F8E028">"AWS S3"</text>
      <text x="430" fill="#F8F0E0">, </text>
      <text x="445" fill="#F8E028">"Docker CI/CD"</text>
      <text x="560" fill="#F8F0E0">],</text>
    </g>

    <!-- Code Line 6 -->
    <g transform="translate(78, 165)">
      <text fill="#F8F0E0">backend:</text>
      <text x="75" fill="#64B5F6">Microservice</text>
      <text x="165" fill="#F8F0E0">.<tspan fill="#81C784">SpringBoot</tspan>({ runtime: <tspan fill="#F8E028">"Java 21"</tspan>, arch: <tspan fill="#F8E028">"Distributed REST"</tspan> }),</text>
    </g>

    <!-- Code Line 7 -->
    <g transform="translate(78, 185)">
      <text fill="#F8F0E0">frontend:</text>
      <text x="85" fill="#F8F0E0">{ stack: <tspan fill="#F8E028">"React 19"</tspan>, lang: <tspan fill="#F8E028">"TypeScript"</tspan>, styling: <tspan fill="#F8E028">"Tailwind CSS"</tspan>, bundler: <tspan fill="#F8E028">"Vite"</tspan> },</text>
    </g>

    <!-- Code Line 8 -->
    <g transform="translate(78, 205)">
      <text fill="#F8F0E0">genAI:</text>
      <text x="60" fill="#E8203A">new</text>
      <text x="90" fill="#64B5F6">AIModel</text>
      <text x="145" fill="#F8F0E0">({ provider: <tspan fill="#F8E028">"Google Gemini"</tspan>, tuning: <tspan fill="#F8E028">"Prompt Engineering"</tspan> }),</text>
    </g>

    <!-- Code Line 9 -->
    <g transform="translate(78, 225)">
      <text fill="#F8F0E0">iotEmbedded:</text>
      <text x="110" fill="#F8F0E0">{ controllers: [<tspan fill="#F8E028">"ESP32"</tspan>, <tspan fill="#F8E028">"NodeMCU"</tspan>], simulation: <tspan fill="#F8E028">"Proteus CAD"</tspan> },</text>
    </g>

    <!-- Code Line 10 -->
    <g transform="translate(78, 245)">
      <text fill="#F8F0E0">telemetryStatus:</text>
      <text x="145" fill="#25D366">"ONLINE // HIGH RESILIENCY // ACTIVE DEPLOYMENT"</text>
    </g>

    <!-- Code Line 11 -->
    <g transform="translate(60, 265)">
      <text fill="#F8F0E0">};</text>
    </g>

    <!-- Code Line 12 -->
    <g transform="translate(60, 285)">
      <text fill="#64B5F6">console</text>
      <text x="56" fill="#F8F0E0">.<tspan fill="#81C784">log</tspan>(</text>
      <text x="95" fill="#F8E028">`[Cluster] System verified for Pavangitu: OK (Latency 12ms)`</text>
      <text x="600" fill="#F8F0E0">);</text>
    </g>

    <!-- Code Line 13 with Blinking Cursor -->
    <g transform="translate(60, 305)">
      <text fill="#888">// Ready to deploy enterprise solutions</text>
      <!-- Blinking Cursor -->
      <rect x="365" y="-10" width="8" height="13" fill="#F8E028">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
