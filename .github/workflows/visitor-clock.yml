name: Visitor clock

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        run: |
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch --depth=1 origin ${{ github.ref_name || 'main' }}
          git checkout -f FETCH_HEAD

      - name: Render the digital clock from the visitors badge
        run: node .github/scripts/visitor-clock.mjs
        env:
          GH_USER: Pavangitu

      - name: Commit and push visitor clock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/visitor-clock.svg
          git commit -m "Update visitor clock" || exit 0
          git push origin HEAD:${{ github.ref_name || 'main' }}
