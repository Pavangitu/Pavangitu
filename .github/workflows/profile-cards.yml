name: Profile cards

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        run: |
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch --depth=1 origin ${{ github.ref_name || 'main' }}
          git checkout -f FETCH_HEAD

      - name: Draw the stats and top languages cards
        run: node .github/scripts/profile-cards.mjs
        env:
          GH_USER: Pavangitu
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit when a card changed
        run: |
          if git diff --quiet -- assets/stats-card.svg assets/languages-card.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-card.svg assets/languages-card.svg
          git commit -m "Update profile cards"
          git push origin HEAD:${{ github.ref_name || 'main' }}
