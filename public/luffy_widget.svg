<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="120">
  <defs>
    <!-- Define keyframe animations for the walk, flip, bounce and text -->
    <style>
      @keyframes walkSideToSide {
        0%, 100% { transform: translateX(10px); }
        50% { transform: translateX(310px); }
      }

      @keyframes luffyBounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }

      @keyframes luffyFlip {
        0%, 49% { transform: scaleX(-1); }
        50%, 99% { transform: scaleX(1); }
      }

      @keyframes textOne {
        0%, 20%, 100% { opacity: 1; }
        25%, 95% { opacity: 0; }
      }
      @keyframes textTwo {
        0%, 20%, 45%, 100% { opacity: 0; }
        25%, 40% { opacity: 1; }
      }
      @keyframes textThree {
        0%, 45%, 70%, 100% { opacity: 0; }
        50%, 65% { opacity: 1; }
      }
      @keyframes textFour {
        0%, 70%, 95% { opacity: 0; }
        75%, 90% { opacity: 1; }
      }

      .luffy-character {
        animation: walkSideToSide 16s infinite linear;
      }

      .luffy-sprite-group {
        animation: luffyFlip 16s infinite steps(1);
        transform-origin: 40px 82px;
      }

      .luffy-sprite {
        animation: luffyBounce 0.4s infinite ease-in-out;
      }

      .phrase {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 8.5px;
        font-weight: bold;
        fill: #ffffff;
        text-anchor: middle;
      }

      .p1 { animation: textOne 16s infinite; }
      .p2 { animation: textTwo 16s infinite; }
      .p3 { animation: textThree 16s infinite; }
      .p4 { animation: textFour 16s infinite; }
    </style>
  </defs>

  <!-- Speech Bubble + Luffy character group -->
  <g class="luffy-character">
    <!-- Speech Bubble (stays unmirrored, only moves) -->
    <g>
      <!-- Glassmorphic speech bubble background -->
      <rect x="-45" y="5" width="170" height="32" rx="8" fill="#120c1c" stroke="#f43f5e" stroke-width="1.5" opacity="0.95" />
      <!-- Triangle pointer -->
      <polygon points="40,37 35,42 45,37" fill="#120c1c" stroke="#f43f5e" stroke-width="0" />
      <!-- Speech Texts stacked and animated -->
      <text x="40" y="24" class="phrase p1">Exploring your profile... Shishishi! 🧭</text>
      <text x="40" y="24" class="phrase p2">Drums of Liberation are beating! 🥁</text>
      <text x="40" y="24" class="phrase p3">Gomu Gomu no... Rocket! 🚀</text>
      <text x="40" y="24" class="phrase p4">I will be King of the Pirates! 🏴‍☠️</text>
    </g>

    <!-- Luffy Sprite Image (gets mirrored separately when walking left) -->
    <g class="luffy-sprite-group">
      <g class="luffy-sprite" style="transform-origin: 40px 82px;">
        <image href="luffy_walk.png" x="0" y="42" width="80" height="80" />
      </g>
    </g>
  </g>
</svg>
