<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" height="250">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    
    <!-- Text Glow / Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Subtle Grid Pattern for High Tech Look -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(6, 182, 212, 0.05)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="250" fill="url(#bg-grad)" rx="15" />
  
  <!-- Overlay Tech Grid -->
  <rect width="900" height="250" fill="url(#grid)" rx="15" />

  <!-- Glowing Abstract Circles -->
  <circle cx="100" cy="50" r="120" fill="#06b6d4" opacity="0.05" filter="url(#glow)" />
  <circle cx="800" cy="200" r="150" fill="#8b5cf6" opacity="0.06" filter="url(#glow)" />

  <!-- Animated-like Lines -->
  <path d="M 0 125 Q 225 75, 450 125 T 900 125" fill="none" stroke="url(#accent-grad)" stroke-width="1.5" opacity="0.15" />
  <path d="M 0 150 Q 225 200, 450 150 T 900 150" fill="none" stroke="url(#accent-grad)" stroke-width="1" opacity="0.1" />

  <!-- Centered/Structured Content -->
  <g transform="translate(450, 115)" text-anchor="middle">
    <!-- Icon Badge -->
    <text y="-50" font-family="'Outfit', 'Inter', sans-serif" font-size="28" fill="#06b6d4" font-weight="800" letter-spacing="4">⚡ CLOUD &amp; FULL-STACK</text>
    
    <!-- Name -->
    <text y="5" font-family="'Outfit', 'Inter', sans-serif" font-size="52" fill="url(#accent-grad)" font-weight="900" letter-spacing="-1">PAVAN DATTA GEDILA</text>
    
    <!-- Tagline -->
    <text y="45" font-family="'Fira Code', monospace" font-size="18" fill="#94a3b8" font-weight="500" letter-spacing="1">DevOps &amp; Infrastructure • AI &amp; Automation</text>
  </g>
</svg>
